<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
  @keyframes signalDraw { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
  @keyframes signalDotFade { from { opacity: 0; } to { opacity: 1; } }
</style>
</helmet>
<svg viewBox="0 0 {{vbW}} {{vbH}}" width="100%" height="{{height}}" style="display:block;overflow:visible;" aria-label="Illustrative signal, not measured data">
  <polyline points="{{polylinePoints}}" fill="none" stroke="#00C04C" stroke-width="1.2" pathLength="100" style="{{lineStyle}}"></polyline>
  <sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
    <circle cx="{{d.cx}}" cy="{{d.cy}}" r="{{d.r}}" fill="{{d.fill}}" stroke="{{d.stroke}}" stroke-width="{{d.strokeWidth}}" style="{{d.style}}"></circle>
  </sc-for>
</svg>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:72},&quot;points&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[46,50,48,53,51,55,58],&quot;tsType&quot;:&quot;number[]&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:220,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:80,&quot;max&quot;:600},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:72,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:40,&quot;max&quot;:80},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const points = this.props.points && this.props.points.length ? this.props.points : [46, 50, 48, 53, 51, 55, 58];
    const w = this.props.width || 220;
    const h = this.props.height || 72;
    const pad = 6;
    const n = points.length;
    const min = Math.min.apply(null, points);
    const max = Math.max.apply(null, points);
    const range = (max - min) || 1;
    const xs = points.map((_, i) => pad + (i / (n - 1)) * (w - pad * 2));
    const ys = points.map((v) => h - pad - ((v - min) / range) * (h - pad * 2));
    const polylinePoints = xs.map((x, i) => x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
    const reduced = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const animate = (this.props.animate ?? true) && !reduced;
    const dots = points.map((v, i) => {
      const isLast = i === n - 1;
      return {
        cx: xs[i].toFixed(1), cy: ys[i].toFixed(1),
        r: isLast ? 3.2 : 2.4,
        fill: isLast ? '#00C04C' : 'none',
        stroke: isLast ? '#00C04C' : 'rgba(0,192,76,0.35)',
        strokeWidth: isLast ? 0 : 1,
        style: isLast ? ('opacity:' + (animate ? 0 : 1) + ';animation:' + (animate ? 'signalDotFade 0.4s ease 0.75s forwards' : 'none') + ';') : 'opacity:0.7;',
      };
    });
    const lineStyle = 'stroke-dasharray:100;stroke-dashoffset:' + (animate ? 100 : 0) + ';stroke-opacity:0.3;' + (animate ? 'animation:signalDraw 0.8s ease forwards;' : '');
    return { vbW: w, vbH: h, height: h, polylinePoints, dots, lineStyle };
  }
}

</script>
</body>
</html>
