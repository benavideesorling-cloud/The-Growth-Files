<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-end;gap:{{gap}}px;height:{{height}}px;border-bottom:1px solid rgba(148,163,184,0.3);">
  <sc-for list="{{ticks}}" as="t" hint-placeholder-count="10">
    <div style="width:{{tickWidth}}px;height:{{t.h}}px;background:rgba(100,116,139,0.4);"></div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:24},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:4,&quot;max&quot;:24},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:12,&quot;max&quot;:40},&quot;tickWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:1,&quot;max&quot;:4},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:10},&quot;heights&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const count = this.props.count || 10;
    const height = this.props.height || 24;
    const provided = this.props.heights && this.props.heights.length ? this.props.heights : null;
    const ticks = [];
    for (let i = 0; i < count; i++) {
      const v = provided ? provided[i % provided.length] : (0.4 + ((i * 37) % 60) / 100);
      ticks.push({ h: Math.max(4, Math.min(1, v) * height).toFixed(1) });
    }
    return { ticks, gap: this.props.gap || 5, height, tickWidth: this.props.tickWidth || 2 };
  }
}

</script>
</body>
</html>
