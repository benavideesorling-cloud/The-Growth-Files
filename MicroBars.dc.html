<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:flex-end;gap:{{gap}}px;height:{{height}}px;">
  <sc-for list="{{bars}}" as="b" hint-placeholder-count="5">
    <div style="width:{{barWidth}}px;height:{{b.h}}px;background:{{b.color}};border-radius:2px;"></div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:140,&quot;height&quot;:40},&quot;values&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[40,55,48,62,50],&quot;tsType&quot;:&quot;number[]&quot;},&quot;highlightIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:5},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:20,&quot;max&quot;:80},&quot;barWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:4,&quot;max&quot;:20},&quot;gap&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:16}}">
class Component extends DCLogic {
  renderVals() {
    const values = this.props.values && this.props.values.length ? this.props.values : [40, 55, 48, 62, 50];
    const height = this.props.height || 40;
    const highlightIndex = this.props.highlightIndex ?? (values.length - 1);
    const max = Math.max.apply(null, values) || 1;
    const bars = values.map((v, i) => ({
      h: Math.max(6, (v / max) * height).toFixed(1),
      color: i === highlightIndex ? '#00C04C' : 'rgba(0,192,76,0.22)',
    }));
    return { bars, gap: this.props.gap || 6, height, barWidth: this.props.barWidth || 8 };
  }
}

</script>
</body>
</html>
