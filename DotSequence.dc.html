<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;width:100%;">
  <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
    <div style="display:flex;align-items:center;flex:{{it.flex}};">
      <div style="{{it.dotStyle}}"></div>
      <sc-if value="{{it.hasLine}}" hint-placeholder-val="{{true}}">
        <div style="{{it.lineStyle}}"></div>
      </sc-if>
    </div>
  </sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:16},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:2,&quot;max&quot;:10},&quot;activeIndex&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:9}}">
class Component extends DCLogic {
  renderVals() {
    const count = this.props.count || 5;
    const activeIndex = this.props.activeIndex ?? (count - 1);
    const items = [];
    for (let i = 0; i < count; i++) {
      const isActive = i === activeIndex;
      const isLast = i === count - 1;
      items.push({
        flex: isLast ? '0 0 auto' : '1 1 auto',
        hasLine: !isLast,
        dotStyle: 'flex-shrink:0;width:' + (isActive ? 8 : 6) + 'px;height:' + (isActive ? 8 : 6) + 'px;border-radius:50%;background:' + (isActive ? '#00C04C' : 'rgba(0,192,76,0.3)') + ';',
        lineStyle: 'flex:1;height:1px;background:rgba(148,163,184,0.35);margin:0 6px;',
      });
    }
    return { items };
  }
}

</script>
</body>
</html>
